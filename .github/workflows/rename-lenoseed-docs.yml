name: Rename documentation to LenoSeed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-lenoseed-docs.yml

permissions:
  contents: write

jobs:
  rename-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename project references in documentation
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B docs-rename-work origin/main

            python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('README.md')]
          files.extend(sorted(Path('docs').rglob('*.md')))

          replacements = (
              (re.compile(r'\bKinseeds\b'), 'LenoSeeds'),
              (re.compile(r'\bKinseed\b'), 'LenoSeed'),
              (re.compile(r'\bKINSEEDS\b'), 'LENOSEEDS'),
              (re.compile(r'\bKINSEED\b'), 'LENOSEED'),
          )

          for path in files:
              text = path.read_text(encoding='utf-8')
              updated = text
              for pattern, replacement in replacements:
                  updated = pattern.sub(replacement, updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          remaining = []
          check = re.compile(r'\b(?:Kinseed|Kinseeds|KINSEED|KINSEEDS)\b')
          for path in files:
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if check.search(line):
                      remaining.append(f'{path}:{lineno}:{line}')

          if remaining:
              raise SystemExit('Unrenamed documentation references remain:\n' + '\n'.join(remaining))
          PY

            rm -f .github/workflows/rename-lenoseed-docs.yml
            git add README.md docs .github/workflows/rename-lenoseed-docs.yml

            if git diff --cached --quiet; then
              echo "No documentation changes needed."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: renomme Kinseed en LenoSeed dans la documentation"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main changed concurrently; retrying from the latest main"
            sleep 2
          done

          echo "Unable to push documentation rename after retries" >&2
          exit 1
